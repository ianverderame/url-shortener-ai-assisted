spring.application.name=url-shortener

server.port=8080

# The short URL is built from this, never from request headers.
app.public-base-url=http://localhost:8080

# Click recording runs off the redirect path on a bounded pool. A full queue drops the click
# (counted in clicks.lost{reason=overflow}); one writer leaves the rest of the connection pool to
# requests.
app.clicks.threads=1
app.clicks.queue-capacity=10000

# OpenAPI description (/v3/api-docs) and interactive docs (/swagger-ui.html) are a deliberate part
# of the service, served on the application port.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Graceful shutdown (Boot's default) must finish inside the container's stop grace period
# (compose: stop_grace_period 30s), so the JVM is never SIGKILLed mid-shutdown.
spring.lifecycle.timeout-per-shutdown-phase=20s

# Operational endpoints live on a separate port, so no application route can shadow them.
# Only health and metrics are exposed there, both without a key (SecurityConfig only protects
# /api/**); compose publishes this port to 127.0.0.1 only. MetricsIT pins the exposed set.
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-components=always
