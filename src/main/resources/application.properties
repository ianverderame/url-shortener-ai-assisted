spring.application.name=url-shortener

server.port=8080

# The short URL is built from this, never from request headers.
app.public-base-url=http://localhost:8080

# Click recording runs off the redirect path on a bounded pool. A full queue drops the click
# (counted in clicks.lost{reason=overflow}); one writer leaves the rest of the connection pool to
# requests.
app.clicks.threads=1
app.clicks.queue-capacity=10000

# A down or hung database fails a request with a 503 within 3 s, and readiness reports it within
# 2 s (decided on #9; DatabaseOutageIT, DatabaseHangIT, ReadinessDuringOutageIT). Borrowing a
# connection gives up after 1 s, but a validation already started may run its 0.5 s to the end:
# 1.5 s at worst. A just-used connection skips validation, and a query sent on it gives up after
# 1 s of silence (pgJDBC socketTimeout, in seconds). A request may pay both: 2.5 s. The socket
# timeout caps every query, including Flyway migrations at startup and the stats aggregation, so
# each must stay well under 1 s.
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=500
spring.datasource.hikari.data-source-properties.socketTimeout=1
# The pool starts without a blocking first connection, so starting it against a hung database
# waits only the connection timeout above (DatabaseHangAtPoolStartIT). In the running service
# Flyway starts the pool at startup, so this matters only if it ever doesn't.
spring.datasource.hikari.initialization-fail-timeout=-1
# Each such failure logs one line, from ProblemDetailsAdvice. These loggers would add more lines,
# some with a stack trace, for the same failure: Hikari for each dead pooled connection it
# validates or finds broken mid-query, and TransactionTemplate when a failed rollback replaces the
# query's exception (which it only logs).
logging.level.com.zaxxer.hikari.pool.PoolBase=error
logging.level.com.zaxxer.hikari.pool.ProxyConnection=error
logging.level.org.springframework.transaction.support.TransactionTemplate=off

# Request bodies are strict (decided on #9): an unknown JSON property is a 400, not ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true

# OpenAPI description (/v3/api-docs) and interactive docs (/swagger-ui.html) are a deliberate part
# of the service, served on the application port.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Graceful shutdown (Boot's default) must finish inside the container's stop grace period
# (compose: stop_grace_period 30s), so the JVM is never SIGKILLed mid-shutdown.
spring.lifecycle.timeout-per-shutdown-phase=20s

# Operational endpoints live on a separate port, so no application route can shadow them.
# Only health and metrics are exposed there, both without a key (SecurityConfig only protects
# /api/**); compose publishes this port to 127.0.0.1 only. MetricsIT pins the exposed set.
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-components=always
