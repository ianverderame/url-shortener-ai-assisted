name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Temurin 21.0.12.1+1 (same build as the Docker images). setup-java needs the exact
          # Adoptium semver when a build suffix is given.
          java-version: "21.0.12+101.0.LTS"
          cache: maven
      - name: Formatting (google-java-format)
        run: ./mvnw -B -ntp spotless:check
      - name: Compile (-Xlint:all -Werror)
        run: ./mvnw -B -ntp test-compile
      - name: Unit tests
        run: ./mvnw -B -ntp test
      - name: Integration tests (Testcontainers)
        run: ./mvnw -B -ntp verify -DskipUTs

  mutation:
    name: Mutation report (PIT, report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS"
          cache: maven
      - name: Mutation testing (fails below the threshold in pom.xml)
        run: ./mvnw -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload report
        # Also when the threshold fails: that is when the report is needed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-report
          path: target/pit-reports/
          # A missing report means PIT ran nothing, which is a failure now that there is code.
          if-no-files-found: error

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the GitHub release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history of the commit under test
        # HEAD only: gitleaks' default (--all) would also scan unrelated fetched branches.
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="--full-history HEAD" \
            --redact --no-banner --verbose

  reviewer-path:
    name: Reviewer path (compose up + smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack and wait until healthy
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test
        run: docker compose run --rm smoke
      - name: Exposure and runtime user
        run: |
          pg=$(docker port "$(docker compose ps -q postgres)")
          echo "postgres published: [$pg]"
          test -z "$pg"
          app_ports=$(docker port "$(docker compose ps -q app)")
          echo "app published: [$app_ports]"
          test -n "$app_ports"
          if echo "$app_ports" | grep -v -- '-> 127\.0\.0\.1:'; then echo "app ports must bind 127.0.0.1 only"; exit 1; fi
          uid=$(docker compose exec -T app id -u)
          echo "app uid: $uid"
          test "$uid" != "0"
      # Issue #27: shutdown always exits inside the 30s grace period, in every database state.
      # Scenario names (C1b, C2, C3) match the characterization on #9. Each check restarts the
      # app, so a prior stop or a paused database never leaks into the next one.
      - name: Clean shutdown under load, healthy database (C1b)
        run: |
          api_key="local-demo-key-NOT-A-SECRET-do-not-use-elsewhere"
          results=$(mktemp)
          for i in $(seq 1 30); do
            (
              out=$(curl -sS --max-time 10 -w '\n%{http_code}' -X POST http://127.0.0.1:8080/api/v1/links \
                -H "X-API-Key: $api_key" -H 'Content-Type: application/json' \
                -d "{\"destination\":\"https://example.com/load/c1b/$i\"}" || printf '\n000')
              status=$(printf '%s\n' "$out" | tail -n 1)
              code=$(printf '%s\n' "$out" | sed '$d' | sed -n 's/.*"code":"\([0-9A-Za-z]\{8\}\)".*/\1/p')
              echo "$status $code" >> "$results"
            ) &
          done
          id=$(docker compose ps -q app)
          docker compose stop app
          wait
          code=$(docker inspect "$id" --format '{{.State.ExitCode}}')
          echo "app exit code: $code"
          test "$code" = "143"
          missing=0
          for committed in $(awk '$1=="201"{print $2}' "$results"); do
            found=$(docker compose exec -T postgres psql -U urlshortener -d urlshortener \
              -tAc "select count(*) from links where code='$committed'")
            [ "$found" = "1" ] || { echo "missing committed link: $committed"; missing=$((missing + 1)); }
          done
          echo "committed links checked: $(wc -l < "$results"), missing: $missing"
          test "$missing" = "0"
      - name: Restart the app
        run: docker compose up -d --wait --wait-timeout 120 app
      - name: Clean shutdown with the database down, idle (C2)
        run: |
          docker compose pause postgres
          id=$(docker compose ps -q app)
          start=$(date +%s)
          docker compose stop app
          elapsed=$(($(date +%s) - start))
          code=$(docker inspect "$id" --format '{{.State.ExitCode}}')
          echo "app exit code: $code, stop took ${elapsed}s"
          test "$code" = "143"
          test "$elapsed" -le 15
      - name: Resume the database and restart the app
        run: |
          docker compose unpause postgres
          sleep 3
          docker compose up -d --wait --wait-timeout 120 app
      - name: Clean shutdown with the database down and a request in flight (C3)
        run: |
          api_key="local-demo-key-NOT-A-SECRET-do-not-use-elsewhere"
          docker compose pause postgres
          curl -sS --max-time 10 -o /dev/null -w '%{http_code}\n' -X POST http://127.0.0.1:8080/api/v1/links \
            -H "X-API-Key: $api_key" -H 'Content-Type: application/json' \
            -d '{"destination":"https://example.com/load/c3"}' &
          sleep 0.1
          id=$(docker compose ps -q app)
          start=$(date +%s)
          docker compose stop app
          elapsed=$(($(date +%s) - start))
          wait
          code=$(docker inspect "$id" --format '{{.State.ExitCode}}')
          echo "app exit code: $code, stop took ${elapsed}s"
          test "$code" = "143"
          test "$elapsed" -le 15
      - name: Resume the database
        if: always()
        run: docker compose unpause postgres || true
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
