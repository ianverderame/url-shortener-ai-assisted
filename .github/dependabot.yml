version: 2
# One grouped PR per ecosystem per week. Major upgrades (Java, Postgres, Spring Boot) are
# deliberate work items, not bumps.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # compose.yaml images.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
